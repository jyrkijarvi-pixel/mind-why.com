<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND - WHY | Uuden ajan käyttöliittymä terveeseen järkeen</title>
    <meta name="description" content="MIND - WHY: Teknologiaa, maailman tilannetta ja terveeseen järkeen perustuvaa logiikkaa ICT-ammattilaisen näkökulmasta.">
    <meta name="keywords" content="teknologia, ICT, logiikka, maailmantilanne, sähköautot, data-analyysi, mind-why">
    <meta name="author" content="Jyrki">
    <meta property="og:title" content="MIND - WHY">
    <meta property="og:description" content="Uuden ajan käyttöliittymä terveeseen järkeen.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://mind-why.com/">
    
    <style>
        :root {
            --brand-yellow: #f1c40f;
            --brand-dark: #121212;
            --brand-gray: #1a1a1a;
            --brand-border: #333;
            --text-light: #e0e0e0;
        }
        body { background-color: var(--brand-dark); color: var(--text-light); font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.3s, color 0.3s; }
        
        body.classic-mode { background-color: #f4f4f4; color: #333; }
        body.classic-mode .container { background-color: #fff; border: 2px solid #000; }
        body.classic-mode .demo-card { background: #eee; border: 1px solid #ccc; }
        body.classic-mode .demo-card a { color: #000; }

        .container { max-width: 800px; width: 100%; border: 1px solid var(--brand-border); padding: 30px; background-color: var(--brand-gray); border-radius: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 13px; color: #888; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .mode-selector button { background: none; border: 1px solid #444; color: #aaa; padding: 5px 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; margin-left: 5px; }
        .mode-selector button.active { background: var(--brand-yellow); color: var(--brand-dark); border-color: var(--brand-yellow); }
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .brand-logo { width: 35px; height: 35px; border: 3px solid var(--brand-yellow); border-radius: 50%; position: relative; }
        .brand-logo::before, .brand-logo::after { content: ''; position: absolute; background-color: var(--brand-yellow); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .brand-logo::before { width: 4px; height: 20px; } .brand-logo::after { width: 20px; height: 4px; }
        h1 { color: #fff; font-size: 32px; margin: 0; }
        .tagline { color: var(--brand-yellow); font-size: 14px; text-transform: uppercase; font-weight: bold; margin: 10px 0 25px 0; border-bottom: 2px solid var(--brand-yellow); padding-bottom: 10px; }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
        .demo-card { background: #222; border: 1px solid #333; padding: 20px; border-radius: 6px; }
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; font-size: 16px; margin: 20px 0; box-sizing: border-box; }
        .demo-card a { color: var(--brand-yellow); text-decoration: none; display: block; margin-top: 5px; font-weight: bold; }
        .footer { margin-top: 40px; font-size: 11px; color: #555; text-align: right; border-top: 1px solid #333; padding-top: 10px; }
        .support-link { color: #777; text-decoration: none; margin-left: 10px; }
        .support-link:hover { color: var(--brand-yellow); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="mode-selector">
            <button id="btn-dynamic" class="active" onclick="asetaMoodi('dynamic')">Dynamic</button>
            <button id="btn-classic" onclick="asetaMoodi('classic')">Classic</button>
        </div>
    </div>

    <div class="brand-header"><div class="brand-logo"></div><h1>MIND</h1></div>
    <div class="tagline">Uuden ajan käyttöliittymä terveeseen järkeen.</div>

    <input type="text" id="mindSearch" class="search-box" placeholder="Suodata kortteja tai kirjoita kysymys Geminiin...">

    <div class="demo-grid" id="main-menu">
        <div class="demo-card">
            <h3>MIND Luovuus & AI</h3>
            <a href="https://gemini.google.com" target="_blank">✨ Gemini (AI & Kuvat)</a>
        </div>
        <div class="demo-card">
            <h3>Some & Viihde</h3>
            <a href="https://www.youtube.com" target="_blank">📺 YouTube</a>
            <a href="https://www.tiktok.com" target="_blank">🎵 TikTok</a>
            <a href="https://www.instagram.com" target="_blank">📸 Instagram</a>
        </div>
        <div class="demo-card">
            <h3>Arki & Yhteys</h3>
            <a href="https://www.k-ruoka.fi" target="_blank">🛒 K-Ruoka</a>
            <a href="https://www.speedtest.net" target="_blank">⚡ Nopeustesti</a>
            <a href="tel:+358408499100">📞 040 849 9100</a>
        </div>
    </div>

    <div class="footer">
        © 2026 mind-why.com | Powered by ICT Logic
        <br>
        <a href="https://paypal.me/JyrkiAntero" target="_blank" class="support-link">Support infrastructure costs via PayPal</a>
    </div>
</div>

<script>
    document.getElementById('mindSearch').addEventListener('input', function() {
        let filter = this.value.toLowerCase();
        let cards = document.querySelectorAll('.demo-card');
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    });

    document.getElementById('mindSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            let query = this.value;
            if (query.length > 0) window.open('https://gemini.google.com/?q=' + encodeURIComponent(query), '_blank');
        }
    });

    function asetaMoodi(m) {
        document.body.classList.toggle('classic-mode', m === 'classic');
    }
</script>
</body>
</html>
