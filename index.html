<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND-WHY | CYBER KIOSK</title>
    <style>
        :root { 
            --accent: #4dd0e1; --bg: #050505; --panel: rgba(20, 20, 20, 0.9); 
            --text: #e0e0e0; --card: rgba(30, 30, 30, 0.6); 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .kiosk-container { width: 90%; max-width: 500px; background: var(--panel); border: 1px solid #333; border-radius: 20px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        
        .header { text-align: center; margin-bottom: 25px; }
        .logo-ring { width: 60px; height: 60px; border: 2px solid var(--accent); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
        .logo-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        
        input { width: 100%; background: #000; border: 1px solid #444; padding: 15px; border-radius: 10px; color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; }
        
        .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button.chip { background: var(--card); border: 1px solid #333; color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        button.chip:hover { border-color: var(--accent); color: var(--accent); }
        
        .main-btn { width: 100%; background: var(--accent); border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .main-btn:active { transform: scale(0.98); }
        
        .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; font-size: 12px; }
        .footer-grid a { color: #888; text-decoration: none; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="kiosk-container">
    <div class="header">
        <div class="logo-ring"><div class="logo-dot"></div></div>
        <h2 style="margin:0; letter-spacing: 2px;">MIND-WHY</h2>
    </div>

    <input type="text" id="q" placeholder="Syötä komento tai kysymys...">
    
    <div class="chips">
        <button class="chip" onclick="set('Renault Zoe SOH 88% analyysi: ')">🔍 Data-analyysi</button>
        <button class="chip" onclick="set('Kirjoita koodia: ')">💻 Koodaus</button>
        <button class="chip" onclick="set('Luo kuva: ')">🎨 Generointi</button>
        <button class="chip" onclick="set('Tekninen selitys: ')">🧠 Selitys</button>
    </div>

    <button class="main-btn" onclick="go()">SUORITA AI-KOMENTO</button>

    <div class="footer-grid">
        <div>
            <a href="https://latauskartta.fi" target="_blank">🔋 Latauskartta</a>
            <a href="https://speedtest.net" target="_blank">⚡ Nopeus</a>
        </div>
        <div style="text-align: right;">
            <a href="#" onclick="alert('System Ready: v2.0')">Systeemi: OK</a>
            <a href="https://gemini.google.com" target="_blank">Gemini →</a>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('q');
    function set(t) { input.value = t; input.focus(); }
    function go() {
        const val = input.value;
        if (val) window.open('https://gemini.google.com/app?q=' + encodeURIComponent(val), '_blank');
    }
</script>

</body>
</html>
