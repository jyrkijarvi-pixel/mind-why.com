<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIND-WHY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#050505;color:#eaeaea;font-family:'JetBrains Mono',monospace;overflow-x:hidden;position:relative}
  /* stars */
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 40%,#fff,transparent),radial-gradient(1px 1px at 65% 20%,#aaa,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent);background-repeat:repeat;background-size:550px 550px;opacity:0.35;pointer-events:none}
  header{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px;position:relative;z-index:2}
  .logo h1{margin:0;font-size:26px;letter-spacing:0.22em;font-weight:600}
  .logo .sub{margin-top:6px;font-size:11px;letter-spacing:0.32em;color:#777;text-transform:uppercase}
  .top-right{display:flex;align-items:center;gap:14px}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:#141414;border:1px solid #262626;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#777}
  .lang{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:0.15em}
  .lang span{cursor:pointer;color:#555}
  .lang span.active{color:#eaeaea;background:#1e1e1e;border:1px solid #333;padding:6px 14px;border-radius:99px}
  .lang .sep{width:1px;height:18px;background:#222}
  /* center orb */
  .center-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68vh;padding:20px 20px 0;z-index:1}
  .orb{width:min(62vw,520px);height:min(62vw,520px);border-radius:50%;background:radial-gradient(ellipse at center,rgba(250,204,21,0.22) 0%,rgba(120,100,10,0.12) 18%,rgba(0,0,0,0) 65%);border:1px solid rgba(255,255,255,0.06);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(250,204,21,0.07) inset}
  .orb::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,255,255,0.06)}
  .orb-core{width:5px;height:5px;background:#facc15;border-radius:50%;box-shadow:0 0 12px #facc15,0 0 24px rgba(250,204,21,0.6)}
  #ai-response{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:86%;max-width:460px;text-align:center;font-size:14px;line-height:1.6;color:#e5e5e5;display:none;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:1px solid rgba(250,204,21,0.2);border-radius:16px;padding:18px 20px;z-index:3}
  #ai-response.show{display:block;animation:fadeIn .4s}
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
  /* personas */
  .personas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px;max-width:760px}
  .persona{padding:10px 20px;border-radius:99px;border:1px solid #2a2a2a;background:#131313;color:#6b6b6b;font-size:13px;letter-spacing:0.06em;cursor:pointer;transition:all .2s;user-select:none}
  .persona:hover{border-color:#3a3a3a;color:#aaa}
  .persona.active{background:transparent;border-color:#facc15;color:#facc15;box-shadow:0 0 0 1px #facc15,0 0 18px rgba(250,204,21,.25)}
  /* input */
  .input-wrap{width:100%;max-width:740px;margin:28px auto 0;background:#111113;border:1px solid #232323;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
  .input-wrap textarea{width:100%;background:transparent;border:none;outline:none;color:#cfcfcf;font-family:inherit;font-size:14px;resize:none;min-height:54px;line-height:1.5}
  .input-wrap textarea::placeholder{color:#4a4a4a}
  .input-footer{display:flex;justify-content:space-between;align-items:center}
  .hint{font-size:11px;color:#555}
  .actions{display:flex;gap:8px;align-items:center}
  .send-btn{background:#facc15;color:#000;border:none;padding:8px 16px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:0.04em}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .status{font-size:11px;color:#444;margin-top:6px}
  .status.live{color:#22c55e}
  /* ambient */
  audio{display:none}
</style>
</head>
<body>
<header>
  <div class="logo">
    <h1>MIND-WHY</h1>
    <div class="sub">Paina miksi vapauttaaksesi</div>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="muteBtn" title="Ambient on/off">🔇</button>
    <div class="lang"><span id="lang-en" onclick="setLang('EN')">EN</span><div class="sep"></div><span id="lang-fi" class="active" onclick="setLang('FI')">FI</span></div>
  </div>
</header>

<div class="center-wrap">
  <div class="orb" id="orb">
    <div class="orb-core" id="orbCore"></div>
    <div id="ai-response"></div>
  </div>

  <div class="personas">
    <div class="persona active" data-p="kaveri" onclick="setPersona('kaveri')">Paras kaveri</div>
    <div class="persona" data-p="viisas" onclick="setPersona('viisas')">Vanha viisas</div>
    <div class="persona" data-p="huumori" onclick="setPersona('huumori')">Huumorinen</div>
    <div class="persona" data-p="tietava" onclick="setPersona('tietava')">Kaikkitietävä</div>
    <div class="persona" data-p="suora" onclick="setPersona('suora')">Suora puhe</div>
  </div>

  <div class="input-wrap">
    <textarea id="userInput" placeholder="Mikä painaa mieltä? Kirjoita tähän. Se jää vain tähän laitteeseen, ei tallenneta mihinkään..."></textarea>
    <div class="input-footer">
      <div class="hint"><span id="aiStatus" class="status">AI: yhdistetään...</span> • <span id="personaLabel">Paras kaveri</span> • ambient.mp3</div>
      <div class="actions">
        <button class="send-btn" id="sendBtn" onclick="ask()">KYSY MIKSI →</button>
      </div>
    </div>
  </div>
</div>

<audio id="ambientAudio" loop preload="none">
  <source src="./ambient.mp3" type="audio/mpeg">
  <source src="https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<script>
const WORKER_URL = "https://ai-mind-why.jyrki-jarvi.workers.dev";

const PERSONAS = {
  kaveri: {name:"Paras kaveri", prompt:"Olet paras kaveri Keravalta. Empaattinen, lämmin, kannustava. Puhu kuin hyvä ystävä, suomeksi. 2-4 lausetta."},
  viisas: {name:"Vanha viisas", prompt:"Olet vanha viisas, 70v elämänkokemusta Keravalta. Rauhallinen, filosofinen, vertauksin. Suomeksi, syvällisesti."},
  huumori: {name:"Huumorinen", prompt:"Olet humoristinen, kuiva sarkasmi, itseironiaa, mutta lopussa aina oikea oivallus. Suomeksi, hauska mutta viisas."},
  tietava: {name:"Kaikkitietävä", prompt:"Olet kaikkitietävä tietosanakirja. Tarkasti, tieteellisesti, selität MIKSI ilmiö tapahtuu. Suomeksi, selkeästi."},
  suora: {name:"Suora puhe", prompt:"Olet suora ja rehellinen. Ei kaunistelua, sano totuus rakentavasti. Suomeksi, ytimekkäästi."}
};

let currentPersona = "kaveri";
let isMuted = true;

function setPersona(p){
  currentPersona = p;
  document.querySelectorAll('.persona').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-p="${p}"]`).classList.add('active');
  document.getElementById('personaLabel').textContent = PERSONAS[p].name;
}

function setLang(l){
  document.getElementById('lang-en').classList.toggle('active', l==='EN');
  document.getElementById('lang-fi').classList.toggle('active', l==='FI');
}

async function ask(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  const btn = document.getElementById('sendBtn');
  const respEl = document.getElementById('ai-response');
  const orb = document.getElementById('orb');
  const core = document.getElementById('orbCore');
  btn.disabled = true;
  btn.textContent = 'MIETTII...';
  respEl.classList.add('show');
  respEl.textContent = '⏳ ' + PERSONAS[currentPersona].name + ' miettii...';
  orb.style.boxShadow = '0 0 120px rgba(250,204,21,0.25) inset, 0 0 40px rgba(250,204,21,0.15)';
  core.style.boxShadow = '0 0 20px #facc15, 0 0 40px #facc15';
  core.style.transform = 'scale(1.8)';

  try{
    const r = await fetch(WORKER_URL + "/api/why", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        title: text.slice(0,100),
        url: "https://mind-why.com",
        prompt: `${PERSONAS[currentPersona].prompt}\n\nKäyttäjä kysyy: ${text}\nVastaa persoonasi mukaisesti.`,
        persona: currentPersona
      })
    });
    const data = await r.json();
    respEl.textContent = data.why || data.response || 'Ei vastausta';
    document.getElementById('aiStatus').textContent = 'AI: ● live - ' + PERSONAS[currentPersona].name;
    document.getElementById('aiStatus').className = 'status live';
  }catch(e){
    respEl.textContent = 'Yhteysvirhe Workeriin: ' + e.message + '\nTarkista https://ai-mind-why.jyrki-jarvi.workers.dev/api/health';
    document.getElementById('aiStatus').textContent = 'AI: offline';
  }finally{
    btn.disabled = false;
    btn.textContent = 'KYSY MIKSI →';
    setTimeout(()=>{ core.style.transform='scale(1)'; }, 600);
  }
}

document.getElementById('userInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});

document.getElementById('muteBtn').onclick = ()=>{
  const audio = document.getElementById('ambientAudio');
  isMuted = !isMuted;
  if(isMuted){ audio.pause(); document.getElementById('muteBtn').textContent='🔇'; }
  else { audio.play().catch(()=>{}); document.getElementById('muteBtn').textContent='🔊'; }
};

// check worker
fetch(WORKER_URL+"/api/health").then(r=>r.json()).then(d=>{
  document.getElementById('aiStatus').textContent = d.ok ? 'AI: ● live' : 'AI: offline';
  document.getElementById('aiStatus').className = d.ok ? 'status live' : 'status';
}).catch(()=>{
  document.getElementById('aiStatus').textContent='AI: offline';
});
</script>
</body>
</html>
