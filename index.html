<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND-WHY // TERMINAL</title>
    <style>
        :root { --neon: #4dd0e1; --bg: #050505; --dim: #222; }
        body { background: var(--bg); color: #aaa; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .win { width: 100%; max-width: 800px; border: 1px solid #333; padding: 20px; background: #0b0b0b; }
        .header { border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; color: var(--neon); }
        .cmd-line { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; background: #000; border: 1px solid #444; color: var(--neon); padding: 10px; font-family: inherit; }
        button { background: var(--neon); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .block { border: 1px solid #222; padding: 15px; }
        .block h4 { color: #fff; margin-top: 0; }
        .block a { color: #666; text-decoration: none; display: block; margin: 5px 0; }
        .block a:hover { color: var(--neon); }
        textarea { width: 100%; height: 100px; background: #050505; border: 1px solid #333; color: #555; margin-top: 20px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="win">
    <div class="header">SYSTEM_READY // MIND-WHY_KIOSK</div>
    
    <div class="cmd-line">
        <input type="text" id="in" placeholder="Syötä komento (esim. /ai Zoe SOH)">
        <button onclick="exec()">EXEC</button>
    </div>

    <div class="grid">
        <div class="block">
            <h4>[AI_CORE]</h4>
            <a href="https://gemini.google.com" target="_blank">> Gemini_Chat</a>
            <a href="https://notebooklm.google.com" target="_blank">> NotebookLM</a>
        </div>
        <div class="block">
            <h4>[VEHICLE_LOG]</h4>
            <a href="https://latauskartta.fi" target="_blank">> Latauskartta</a>
            <a href="https://canze.fisch.lu/" target="_blank">> CanZE_Project</a>
        </div>
    </div>

    <textarea id="log" placeholder="PAIKALLINEN LOKI (Tallentuu selaimeen)..."></textarea>
</div>

<script>
    const input = document.getElementById('in');
    const log = document.getElementById('log');
    
    // Lataa loki
    log.value = localStorage.getItem('m_log') || '';
    log.oninput = () => localStorage.setItem('m_log', log.value);

    function exec() {
        const val = input.value;
        if(val.startsWith('/ai ')) {
            window.open('https://gemini.google.com/app?q=' + encodeURIComponent(val.substring(4)), '_blank');
        } else {
            alert('Tuntematon komento. Käytä: /ai [kysymys]');
        }
    }
</script>

</body>
</html>
