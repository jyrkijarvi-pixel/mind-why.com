<!DOCTYPE html>
<html lang="fi" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELDERMIND | Minimalist Dashboard</title>
    <style>
        :root { --brand-yellow: #f1c40f; --brand-dark: #121212; --brand-gray: #1a1a1a; --brand-border: #333; --text-light: #e0e0e0; }
        body { background-color: var(--brand-dark); color: var(--text-light); font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; border: 1px solid var(--brand-border); padding: 30px; background-color: var(--brand-gray); border-radius: 8px; }
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .brand-logo { width: 35px; height: 35px; border: 3px solid var(--brand-yellow); border-radius: 50%; position: relative; }
        .brand-logo::before, .brand-logo::after { content: ''; position: absolute; background-color: var(--brand-yellow); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .brand-logo::before { width: 4px; height: 20px; } .brand-logo::after { width: 20px; height: 4px; }
        h1 { color: #fff; font-size: 32px; margin: 0; }
        .tagline { color: var(--brand-yellow); font-size: 14px; text-transform: uppercase; font-weight: bold; margin: 10px 0 25px 0; border-bottom: 2px solid var(--brand-yellow); padding-bottom: 10px; }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-top: 20px; }
        .demo-card { background: #222; border: 1px solid #333; padding: 20px; border-radius: 6px; }
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; font-size: 16px; box-sizing: border-box; }
        .demo-card a { color: var(--brand-yellow); text-decoration: none; display: block; margin-top: 5px; font-weight: bold; }
        .mode-select { display: flex; gap: 15px; margin-bottom: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header"><div class="brand-logo"></div><h1>ELDERMIND</h1></div>
    <div class="tagline">Uuden ajan käyttöliittymä terveeseen järkeen.</div>

    <div class="mode-select">
        <label><input type="radio" name="aiMode" value="text" checked> Teksti</label>
        <label><input type="radio" name="aiMode" value="image"> Kuva (Image Gen)</label>
    </div>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
        <input type="text" id="mindSearch" class="search-box" placeholder="Kirjoita kysymys tai prompti...">
        <button id="search-btn" onclick="suoritaHaku()" style="padding: 12px 20px; background: var(--brand-yellow); border: none; font-weight: bold; cursor: pointer; color: #000; min-width: 120px;">HAE</button>
    </div>

    <div class="demo-grid">
        <div class="demo-card">
            <h3>MIND Luovuus & AI</h3>
            <a href="https://gemini.google.com" target="_blank">✨ Gemini (AI & Kuvat)</a>
        </div>
        <div class="demo-card">
            <h3>Dev Tools</h3>
            <a href="https://ifconfig.me" target="_blank">🔍 Check My IP</a>
        </div>
        <div class="demo-card">
            <h3>Some & Viihde</h3>
            <a href="https://www.youtube.com" target="_blank">📺 YouTube</a>
            <a href="https://www.tiktok.com" target="_blank">🎵 TikTok</a>
            <a href="https://www.instagram.com" target="_blank">📸 Instagram</a>
            <a href="https://www.facebook.com" target="_blank">📘 Facebook</a>
        </div>
        <div class="demo-card">
            <h3>Arki & Yhteys</h3>
            <a href="https://www.k-ruoka.fi" target="_blank">🛒 K-Ruoka</a>
            <a href="https://www.speedtest.net" target="_blank">⚡ Nopeustesti</a>
            <a href="tel:+358408499100">📞 040 849 9100</a>
        </div>
    </div>
</div>

<script>
    function suoritaHaku() {
        const inputField = document.getElementById('mindSearch');
        const mode = document.querySelector('input[name="aiMode"]:checked').value;
        const btn = document.getElementById('search-btn');
        let query = inputField.value;
        if (!query) return;

        const finalQuery = (mode === 'image') ? "Luo kuva aiheesta: " + query : query;

        navigator.clipboard.writeText(finalQuery).then(() => {
            btn.innerText = 'KOPIOITU!';
            btn.style.background = '#27ae60';
            setTimeout(() => {
                window.open('https://gemini.google.com/', '_blank');
                btn.innerText = 'HAE';
                btn.style.background = 'var(--brand-yellow)';
                inputField.value = '';
            }, 800);
        });
    }
</script>
</body>
</html>
