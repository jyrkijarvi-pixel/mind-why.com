Oma rakentelu on selkeästi parempi vaihtoehto 500€ budjetilla.

Ehdotus:
- Käytetty Mini-ITX kotelo: 40€
- AsRock N100M emolevy + CPU: 110€
- 16GB DDR4: 45€
- 2x 4TB IronWolf (RAID1): 2x95€ = 190€
- PicoPSU 90W: 40€
- TrueNAS Scale ilmainen.

Yhteensä: ~425€. Säästät 75€ ja saat tehokkaamman raudan kuin Synology DS223j (jossa surkea Realtek CPU). 
Voit pyörittää Dockeria, Plexiä, Home Assistantia. Synology on ylihinnoiteltu muovilaatikko.

2. AIKA JA YLLÄPITO: Arvioit 425€ mutta et laskenut 10 tuntia asennusta, TrueNAS-päivityksiä, boot-ongelmia ja sitä kun vaimo kysyy miksi Plex ei toimi. Synology toimii 15 minuutissa.

3. PÖLY, MELU JA TAKUU: Avoin halpakotelo kerää pölyä, 2x HDD resonoi. Synology on suunniteltu olohuoneeseen. Käytetyissä osissa ei takuuta, Synologyssa 2v.
