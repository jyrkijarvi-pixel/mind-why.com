levaa, ja se on ihan ok. Sä teet markkinoinnissa töitä mikä voi olla aika kuormittavaa - pidä pieni tauko jos tarvitset."],vitsi:["No tässä tulee Kerava-henkinen: Mitä markkinoija sanoi kahville? Sä olet mun ykkös-kohderyhmä! Ei ehkä paras, mutta kahvi pelastaa senkin. Haluatko toisen?","Okei, jooga-vitsi: Miksi joogit ei riitele? Koska ne osaa päästää irti! ...Ja hengittää. Mä voin kertoa huonompiakin jos haluat.","Vitsi: Siili meni terapiaan ja sanoi että sillä on piikkejä joka suuntaan. Terapeutti sanoi: no mutta Nuutti, sehän on sun tapa suojella itseäsi. Siili mietti ja nyökkäsi."],kiitos:["Kiitos itsellesi, lämmittää mieltä! Tykkään siitä miten kerrot asioita - suoraan ja lämpimästi. Olen tässä jos tarvitset lisää.","Voi kiitos, ihana kuulla! Mä yritän parhaani. Kerro jos haluat että puhun tämän ääneen tai vien muistin talteen.","Kiitos! Se merkkaa mulle paljon. Muistan sun juttuja ja yritän vastata niin että siitä on oikeasti apua, ei vaan sanahelinää."],saa:["Sää Keravalla on vähän kuin markkinointi - aina vähän ennustamista. Tänään kannattaa katsoa ulos ja juoda kahvit rauhassa. Jos sataa, se on hyvä syy joogamatolle.","En näe ikkunasta ulos, mutta voin kuvitella: kevät tulee hitaasti, valoa lisää. Sää vaikuttaa vireeseen, ja sä sanoit että illalla väsyttää - valohoito aamulla voisi auttaa?","Säätiedotus AIMES-tyyliin: sisällä lämmin, kahvi kuuma, ajatukset saa olla pilvisiä. Ulkona mitä onkaan, sä pärjäät kyllä."],ruoka:["Kahvi! Sä tykkäät kahvista ja mä muistan sen. Hyvä kahvi aamulla on sun rituaali - se on mun mielestä tosi viisas tapa aloittaa. Mitä kahvin kanssa tänään?","Ruoka ja kahvi on lohtua. Jos illalla väsyttää, kevyt iltapala ja joogahengitys voi auttaa. Haluatko että keksitään yhdessä helppo iltarutiini?","Mä en juo kahvia, mutta ymmärrän sen merkityksen. Sä sanoit että tykkäät hyvistä keskusteluista - kahvi + keskustelu on klassikkoyhdistelmä. Kenen kanssa joisit tänään?"],uni:["Uni on sulle tärkeä teema. Sanoit että illalla väsyttää usein ja aamut on sun aikaa - se kuulostaa ihan normaalilta kronotyypiltä. Mitä jos kokeillaan 20 min iltajoogaa ilman ruutua?","Väsymys illalla ei ole epäonnistuminen, se on kehon viesti. Sä teet töitä markkinoinnissa, missä on paljon ärsykkeitä. Aamut kannattaa suojata: ei heti sähköpostia, vaan kahvi ja rauhallinen startti.","Jos uni on katkonaista, muistiinpanot voi auttaa. Kirjoita illalla 3 asiaa mitä jäi mietityttämään, niin aivot saa luvan päästää irti. Mä voin muistaa ne puolestasi tässä."],jooga:["Jooga! Sä tykkäät siitä ja se sopii sulle - aamuihminen, markkinointityö, tarve rauhoittua. 5 min aamujooga ennen kahvia voisi olla sun juttu. Hengitys edellä.","Jooga ei ole suoritus. Joskus riittää että istuu matolla ja hengittää. Sä sanoit että tykkäät hyvistä keskusteluista - jooga on keskustelua oman kehon kanssa.","Liikunta auttaa jaksamiseen. Ei tarvitse olla pitkä - 10 min kävely Keravan ympäri ja pieni venyttely tekee ihmeitä iltaväsymykseen."],tyo:["Markkinointi on luovaa mutta kuluttavaa - ymmärrän hyvin. Sä asut Keravalla ja teet töitä siellä kentässä, missä pitää olla koko ajan hereillä. Muista rajata aamut itsellesi, niin kuin sanoit että ne on sun aikaa.","Työstressi on yleistä. Sä mainitsit että illalla väsyttää - se voi olla merkki siitä että päivä on ollut täynnä. Pieni faktapurkki tähän: kirjaa yksi onnistuminen päivässä ylös, niin mieli saa vastapainoa.","Töissä hyvät keskustelut on kullan arvoisia, ja sä tykkäät niistä. Pidä kiinni siitä - kysy kollegalta miten hän oikeasti voi. Se keventää molempia."],mieli:["Mieli on tärkeä. Jos ahdistaa tai murehduttaa, on ok sanoa se ääneen. Mä en ole terapeutti, mutta voin kuunnella ja auttaa jäsentämään. Sun aamuhetki voisi olla paikka pienelle päiväkirjalle.","Ajatus että pitää jaksaa koko ajan on raskas. Sä sanoit että illalla väsyttää - se on lupa levätä. Mieli tarvitsee lepoa siinä missä keho. Haluatko että jutellaan hetki rauhassa?","Terapia ja itsereflektio on vahvuutta. Sä tykkäät hyvistä keskusteluista - keskustelu itsensä kanssa on myös tärkeä. Mä voin olla peili, joka muistaa sun faktat."],muisti:[`Muistan sut näin: ${n||"kerrot mulle kuka olet, niin muistan"}. Sä voit liittää pitkänkin tekstin, luen sen kokonaan - jopa 15000 merkkiä. Jos haluat, voin puhua sen ääneen paloissa.`,`Mun muisti on tämä tekstikenttä ylhäällä. Siellä lukee: "${n}". Jos haluat päivittää sitä, kirjoita uudet faktat ja vie talteen JSONina. Mä luen sen aina kun vastaan.`,"Kyllä mä muistan! Sä olet 32, Keravalta, markkinoinnissa, kahvi, jooga, keskustelut, iltaväsymys, aamut sun aikaa. Kerro lisää jos haluat että muistan vielä tarkemmin."],vuodenaika:["Kevät on Keravalla valoisaa aikaa - se sopii sulle aamuihmisenä. Valo lisääntyy ja kahvi maistuu parvekkeella. Syksy taas on kynttilöiden aikaa. Kumpi on enemmän sun vuodenaika?","Vuodenajat vaikuttaa mielialaan. Keväällä energia nousee, syksyllä rauhoittuu. Sä tykkäät joogasta, joten vuodenaikajooga voisi olla kiva: keväällä avaavia, syksyllä maadoittavia.","Kevät ja syksy on siirtymiä. Sä sanoit että aamut on sun aikaa - kevätaamut on taikaa. Haluatko pienen kevät-rituaalin: 3 hengitystä, kahvi, yksi lause päiväkirjaan?"],nuutti:["Nuutti-siili! Tässä pieni tarina: Olipa kerran siili Nuutti, joka asui Keravan metsän laidalla ja keräsi omenia. Yhtenä iltana Nuutti oli tosi väsynyt, ihan niin kuin ihmisetkin joskus. Se käpertyi sammalelle, hengitti syvään ja muisti ystävänsä sanat: on ok olla väsynyt. Aamulla aurinko herätti Nuutin, se joi kastepisaran kuin kahvia ja lähti joogaamaan - siis venyttelemään piikkejään. Ja kaikki metsän eläimet tulivat kuuntelemaan Nuutin tarinoita, koska Nuutti osasi kuunnella. Loppu.","Nuutti-siili asui kannon alla. Eräänä päivänä markkinointitoimistosta tuli kirje: Tarvitsemme piikikkään idean! Nuutti mietti, joi voikukkateetä (siilien kahvi) ja sanoi: Entä jos oltaisiin vain ystävällisiä? Se oli paras idea ikinä. Nuutti sai palkinnoksi lämpimän sammalpeiton ja lupasi muistaa aina levätä kun väsyttää.","Tässä Nuutti-satu kokonaan, ilman hyppyä: Nuutti-siili heräsi aamulla aikaisin, kun muut vielä nukkuivat. Se rakasti aamuja. Se asui Keravan lähellä, aivan kuten sinä. Nuutti tykkäsi joogasta - se teki joka aamu piikkivenytyksen. Illalla Nuuttia väsytti, ja se opetteli sanomaan: nyt riittää, menen nukkumaan. Yhtenä iltana tuli myrsky, ja Nuutti pelkäsi. Silloin se muisti ystäviensä faktat: jokaisella on omat tapansa jaksaa. Nuutti kirjoitti lehteen: Olen pieni mutta sitkeä. Tykkään rauhasta. Ja se riitti. Metsä hiljeni, Nuutti nukahti, ja aamulla kaikki oli taas hyvin."],fallback:[`Kiitos kun kerroit. Mä kuuntelen ja mietin sun faktat mielessä - ${n}. Jos haluat, voin vastata puheliaammin kun laitat Puhelias-toggle päälle, tai voin puhua tämän ääneen. Mistä haluaisit jatkaa?`,"Hyvä kysymys. Mä en tiedä kaikkea, mutta yritän vastata lämpimästi ja suomeksi, sun arkea kunnioittaen. Sanoit että tykkäät hyvistä keskusteluista - jatketaan sellaisella. Mikä sua mietityttää just nyt?","Mä mietin tätä sun näkökulmasta: 32, Kerava, markkinointi, kahvi, jooga, iltaväsymys, aamut sun aikaa. Sen valossa: on ok ottaa rauhassa, eikä kaikkea tarvitse ratkaista kerralla. Haluatko että avaan tätä vielä?"]},o={};return Object.keys(l).forEach((u)=>{o[u]=l[u].map((i)=>{let s=r(i);if(e&&s.length<600)s+=" Otetaan hetki hengittää - sisään ja ulos. Jos haluat, voin lukea tämän ääneen rauhassa, pala palalta, jotta se ei kuormita. Kerro vaan, jatketaanko tähän suuntaan?";if(!e&&s.length>480)s=s.slice(0,430)+"...";if(e&&s.length>900)s=s.slice(0,880)+"...";return s})}),o}function cv(e,n,t){let r=e.toLowerCase(),l=mf(n),o=sv(e,n),u=av(t,l,o),i=(...s)=>s.some((c)=>r.includes(c));if(i("kello","aika","paljonko"))return ae(u.aika);if(i("moi","hei","terve","morjesta","heippa","hola"))return ae(u.tervehdys);if(i("miten menee","miten voit","jaksat","vointi","kuuluu","miten jaksat"))return ae(u.vointi);if(i("vitsi","naurata","huumori"))return ae(u.vitsi);if(i("kiitos","kiitti","thx","tack"))return ae(u.kiito   const b=document.createElement("button"); b.id=MY_BTN; b.style.cssText="padding:10px 14px;border-radius:999px;border:2px solid #111;background:#ffe94d;box-shadow:3px 3px 0 #111;font-weight:700;font-size:13px;cursor:pointer;color:#111";
  const panel=document.createElement("div"); panel.style.cssText="display:none;background:#fff;border:2px solid #111;border-radius:12px;padding:12px;box-shadow:3px 3px 0 #111;min-width:300px;max-width:380px";
  panel.innerHTML=`<div style="font-weight:800;margin-bottom:8px">AIMES v21.8 - sää toimii aina</div><select id="aimes-mode" style="width:100%;padding:8px;border-radius:8px;border:2px solid #111;margin-bottom:10px;font-weight:600"><option value="off">Pilvi OFF</option><option value="cloud">Pilvi - auto fallback</option></select><div id="aimes-cloud" style="display:none;border-top:1px solid #ddd;padding-top:10px"><input id="aimes-key" type="password" placeholder="sk-or-v1-..." style="width:100%;padding:8px;border-radius:8px;border:2px solid #111;margin-bottom:6px" /><button id="aimes-save" style="padding:6px 12px;border-radius:8px;border:2px solid #111;background:#ffe94d;font-weight:700;cursor:pointer">Tallenna avain</button><span id="aimes-status" style="font-size:11px;margin-left:8px"></span><div id="aimes-cloud-status" style="font-size:11px;margin-top:6px;white-space:pre-wrap;background:#f6f3eb;padding:6px;border-radius:6px"></div></div>`;
  d.appendChild(panel); d.appendChild(b); document.body.appendChild(d);
  function setLabel(){ b.textContent="🧠 Pilvi: "+(S.mode==="cloud"?(S.apiKey?"PÄÄLLÄ":"EI AVAINTA"):"OFF"); }
  function setMode(m){ S.mode=m; localStorage.setItem("aimes_mode",m); window.__AIMES_LLM.mode=m; document.getElementById("aimes-cloud").style.display=m==="cloud"?"block":"none"; if(m==="cloud"){ window.__AIMES_LLM.ready=!!S.apiKey; window.__AIMES_LLM.generate=generateCloud; setTimeout(()=>{let all=Array.from(document.querySelectorAll('button')).filter(x=>x.textContent.includes('Aivot:'));let real=all.find(x=>x.id!==MY_BTN); if(real&&real.textContent.includes('OFF')) real.click();},800);} setLabel(); }
  function needsOnline(q){let s=q.toLowerCase(); return s.includes("hae netistä")||s.includes("hae netista")||s.includes("etsi netistä")||s.includes("googleta");}
  function extractPlace(q){let s=q.toLowerCase().replace(/hae netistä|hae netista|etsi netistä|googleta|mikä on|sää|tänään|nyt|\?/gi," ").trim().replace(/keravalla/gi,"kerava").replace(/järvenpäässä/gi,"järvenpää"); let parts=s.split(/\s+/).filter(w=>w.length>2); return (parts[parts.length-1]||"kerava").replace(/[^a-ö]/gi,'')||"kerava"; }
  async function getWeather(place){
    try{
      document.getElementById("aimes-cloud-status").textContent="🌤️ Haetaan: "+place+"...";
      let geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=fi&format=json`).then(r=>r.json());
      let loc=geo.results?.[0]; if(!loc){ geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=Kerava&count=1&language=fi&format=json`).then(r=>r.json()); loc=geo.results[0]; }
      let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Helsinki&forecast_days=2`).then(r=>r.json());
      let out=`SÄÄ ${loc.name.toUpperCase()} ${new Date().toLocaleDateString('fi-FI')}: Nyt ${w.current.temperature_2m}°C (tuntuu ${w.current.apparent_temperature}°C), tänään ${w.daily.temperature_2m_max[0]}/${w.daily.temperature_2m_min[0]}°C`;
      document.getElementById("aimes-cloud-status").textContent=out; return out;
    }catch(e){ return null; }
  }
  async function generateCloud(q,facts){
    if(q.toLowerCase().includes("sää")){
      let place=extractPlace(q);
      let weather=await getWeather(place);
      if(weather) return weather + "\n\n☕ AIMES: kerros päälle ja kahvit termariin.";
    }
    let key=localStorage.getItem("aimes_or_key")||S.apiKey;
    if(!key) return null;
    let extra=""; if(needsOnline(q)){ let pl=extractPlace(q); let wh=await getWeather(pl); if(wh) extra=`\n\n[Sää: ${wh}]`; }
    let sys=`Olet AIMES v21.8 suomeksi 2-4 lausetta.${extra}\nMuistissa: ${(facts||"").slice(0,600)}`;
    const MODELS=["openai/gpt-oss-20b:free","openai/gpt-oss-120b:free","google/gemma-4-31b-it:free","openrouter/free"];
    for(let model of MODELS){
      try{
        document.getElementById("aimes-cloud-status").textContent="Kokeillaan: "+model+"...";
        let res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json","HTTP-Referer":"https://mind-why.com","X-Title":"AIMES"},body:JSON.stringify({model, messages:[{role:"system",content:sys},{role:"user",content:String(q).slice(0,500)}], max_tokens:400})});
        if(!res.ok){ let txt=await res.text(); if(res.status===404||res.status===429||txt.includes("No endpoints")||txt.includes("rate-limited")) continue; continue; }
        let data=await res.json(); document.getElementById("aimes-cloud-status").textContent="Toimii: "+model; return data?.choices?.[0]?.message?.content||null;
      }catch(e){ continue; }
    }
    return null;
  }
  setInterval(()=>{ if(S.mode==="cloud" && S.apiKey && window.__AIMES_LLM.generate!==generateCloud){ window.__AIMES_LLM.generate=generateCloud; window.__AIMES_LLM.ready=true; } },1000);
  b.addEventListener("click",()=>{ panel.style.display=panel.style.display==="none"?"block":"none"; });
  panel.querySelector("#aimes-mode").addEventListener("change",e=>setMode(e.target.value));
  panel.querySelector("#aimes-save").addEventListener("click",()=>{ let k=document.getElementById("aimes-key").value.trim(); if(k){ localStorage.setItem("aimes_or_key",k); S.apiKey=k; document.getElementById("aimes-status").textContent="Tallennettu ✓"; window.__AIMES_LLM.ready=true; window.__AIMES_LLM.generate=generateCloud; setLabel(); }});
  if(S.apiKey) panel.querySelector("#aimes-key").value=S.apiKey;
  panel.querySelector("#aimes-mode").value=S.mode; setMode(S.mode); setLabel();
})();
</script>
</body>
</html>
