        :root {
          --bg: #F6F1E6;
          --card: #FFFFFF;
          --ink: #111111;
          --border: #111111;
          --muted: #6B6560;
          --yellow: #FFE88E;
          --green: #CFF0C0;
          --blue: #C2DDFF;
          --purple: #E8DDFF;
          --pink: #FFD4E8;
          --orange: #FFD6A0;
          --safe-area-inset-top: 0px;
        }
        * { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        h1,h2,h3 { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; letter-spacing: -0.02em; font-weight: 700; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #111; border-radius: 999px; }
        .card { background: var(--card); border: 2px solid var(--border); border-radius: 18px; box-shadow: 4px 4px 0px var(--border); }
        .badge { border: 1.5px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
        .btn { border: 2px solid var(--border); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 13px; background: white; transition: all 0.12s; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0px var(--border); }
        .btn:active { transform: translate(1px,1px); box-shadow: 0px 0px 0px var(--border); }
        .btn-black { background: var(--ink); color: white; }
        .btn-purple { background: var(--purple); }
        .btn-yellow { background: var(--yellow); }
        .btn-green { background: var(--green); }
        .btn-orange { background: var(--orange); }
        .pulse { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .progress-inner { transition: width 0.3s ease; }
        input[type="range"] { accent-color: #111; }
        @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 12px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        .mic-listening { animation: micPulse 1.5s infinite; border-color: #ef4444 !important; background: #fee2e2 !important; }
        @keyframes wave { 0%,100% { height: 6px; } 50% { height: 18px; } }
        .wave-bar { width: 3px; background: #ef4444; border-radius: 999px; display: inline-block; margin: 0 1.5px; animation: wave 0.8s infinite ease-in-out; }
        @keyframes bigPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,0,0,0.3); } 50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0,0,0,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
        .big-mic { animation: bigPulse 1.6s infinite; }
