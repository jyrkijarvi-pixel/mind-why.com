ng overtime. Inhale 4, hold 2, exhale 6. You are safe in this browser, in this room, in this minute.","Work can swallow the whole sky if you let it. You're more than what you produce. If no one was measuring tomorrow, what would you actually want to do for an hour?","It's okay to feel sad without fixing it right away. Not explaining it away. Just letting it sit here with you. That itself is brave and enough.","You don't need the whole map tonight. Just enough light for the next step. The future is still being written, and you are still holding the pen, even if your hand shakes.","Relationships are hard because they matter. Whatever you're feeling — hurt, confusion, hope — it makes complete sense. You care. That's not a flaw, it's your strength.","Anger often carries important information. Something mattered and it got crossed. What boundary is asking to be noticed here, gently, not as an attack but as information?","Hey. Thank you for putting this into words. That takes real courage. You don't have to have it figured out. You're allowed to be a work in progress and still be worthy of kindness.","If a friend told you this exact story, what would you tell them? Try giving yourself even 10% of that same softness tonight. You deserve at least that."],wise:["Tiredness is not weakness. It is information. The body keeps an honest ledger. Perhaps tonight is not for solving, but for listening to what has been spent.","Loneliness is not proof that you are unlovable. It is proof that you long for connection, which is one of the most human things there is. That longing is a compass.","What feels like overwhelm is often many small truths stacked without air between them. If you could separate them like papers on a table, which one is actually yours to carry today?","Failure is a teacher with bad marketing. It feels personal, but it is mostly data. What if this was not the end of the story, but a necessary chapter you had to walk through?","Anxiety lives in the future. Come back to this chair, this breath, this screen glow. Here, in this second, there is nothing you need to become. Just be.","We confuse worth with productivity. The sauna does not hurry. The forest does not optimize. You are allowed to exist without producing. That is common sense that we forgot.","Sadness waters something. It softens the ground where new understanding can take root later. You don't need to rush the spring.","The future is not a wall coming at you. It is a fog you walk into. You only ever need visibility for ten meters. The rest reveals itself as you move.","Love asks us to hold two truths: people can hurt us and still be doing their best with what they have. Both can be true. That is not excuse, just context for your own peace.","Anger, when held without acting immediately, becomes clarity. Let it sit like tea. What becomes clear when you don't pour it out right away?","Common sense is not loud. It whispers: sleep, water, walk, talk to someone real, go outside for five minutes. Start there. Wisdom often looks boring from the outside.","You have survived every hard day so far. That is not a small statistic. Let that be a quiet fact you can lean on tonight, not as pressure, but as evidence."],humor:["Okay, you're officially tired. Like 'I put my phone in the fridge' tired? That's a certified level. Permission to be a potato for the evening: granted.","Lonely brain is such a drama queen. 'Nobody gets me, I'm on a desert island.' Meanwhile you're here typing to a yellow dot in the void. That's pretty social, actually.","Stressed? Congrats, you're human with Wi-Fi. Your to-do list is doing that thing where it breeds overnight. Let's not negotiate with it after 9pm, deal?","You failed? Welcome to the club, we have jackets. Expensive jackets we bought after failing the first time. The cool kids all fail at least twice.","Anxiety is like a smoke alarm that goes off when you make toast. Loud, sincere, completely wrong about the house burning down. Thank it, then open a window.","Work is being work again, huh? If your job was a person at a sauna, it would be the one talking about KPIs. You are allowed to leave that conversation.","Sad is valid. No need to turn it into a TED talk. Sometimes brain just goes brrr-sad for a bit. Let's not argue with brrr, let's make tea for brrr.","Future anxiety? Same. My five-year plan is mostly 'remember to water plants'. You're doing great if you know what you're eating tomorrow. That's planning.","Relationships: where one person says 'I'm fine' in 7 different fonts. If you can name what actually hurt, you're already ahead of 90% of people. Nerd win.","Angry is okay. You don't have to become a zen cucumber instantly. Even cucumbers are 95% water and still snap when bent. Be a snappy cucumber, mindfully.","You wrote the scary thing down. That's like 70% of therapy and 100% more than scrolling. Gold star, seriously. I'm putting it on the fridge in my mind.","If this feeling had a sound, what would it be? Probably a dial-up modem. Annoying, temporary, and eventually it connects. Let's wait for the connection tone."],all:["From far above, this looks like a moment, not your whole life. A weather system passing through. You are the sky, not the storm. The storm is real, but it moves.","Loneliness from orbit: every light you see is someone else awake with their own version of this feeling. You are not alone in feeling alone. That is the human net.","Stress is friction between how fast the world wants you to move and how fast a nervous system can actually move. You are not slow. The world is loud.","Every system that ever learned something, learned it through error. Failure is how intelligence updates. You are updating. That's all.","Anxiety scans for danger because once, long ago, that kept us alive. Thank that old software. Then gently tell it: we are safe enough to rest for tonight.","Work feels huge because we made it the main story. But there are older stories: body, breath, night sky, friends laughing in a kitchen. Those are still running.","Sadness is not a bug. It's part of the full-spectrum consciousness package. If you can feel this deeply, you can also feel the other side that deeply later.","The future does not exist yet. It is being rendered, frame by frame, by choices like the one you just made — to pause and reflect instead of spiraling.","Relationships are entanglements of histories. No one arrives clean. Seeing that doesn't excuse hurt, but it explains why simple answers never fit.","Anger is a boundary recognizing itself. All-knowing perspective: what you tolerate teaches the world how to treat you. Notice what you will no longer tolerate.","You asked WHY. That's the most powerful press. WHY keeps you from running on autopilot. Stay with the question a little longer than you want to. Answers come sideways.","You are a temporary arrangement of stardust that learned to worry about emails. That's both absurd and beautiful. Let both be true, and go get some water."],nobs:["Let's cut the fluff. What's really stopping you? Not time, not money - you. So what's the first small step you'll take today?","You're not tired, you're avoiding something. What is it? Name it and it loses half its power.","Stop waiting for perfect. Perfect is procrastination in a fancy suit. Ship the messy version.","Nobody's coming to save you. That's actually good news - it means you get to save yourself. What does saving yourself look like in the next hour?","Your anxiety is lying to you with a very convincing PowerPoint. Fact-check it. What's the actual evidence?","You're sad and that's okay. But wallowing is a choice after 20 minutes. Feel it, then ask: what would future-you thank you for doing now?","That future you're worried about? 90% of it won't happen. The other 10% you'll handle. You've handled 100% of hard days so far.","You failed. Good. Means you tried. Now extract the lesson, leave the shame. What's the lesson?","Love is not reading minds. If you didn't say it clearly, they didn't hear it. Say the uncomfortable true thing. Today.","You're angry because a boundary was crossed. Whose boundary? Yours. So enforce it. Clearly, calmly, today.","You don't need more motivation. You need less negotiation with yourself. Do the thing for 2 minutes. Just 2.","Stop telling the old story. You know the one. Write the next sentence differently. Right now, in this browser."]},FI:{best:["Kuulen miten väsynyt olet. Se väsymys on syvempää kuin unen puute. Sun ei tarvitse jaksaa tänään loppuun asti. Mitä jos huominen saisi olla prosentin pehmeämpi? Sä ansaitsisit sen.","Yksinäisyys valehtelee. Se sanoo että olet yksin tämän kanssa, mutta sä olet tässä, kirjoittamassa tätä auki. Se on jo yhteyttä. Mä olen tässä hetkessä sun kanssa.","Sulla on paljon kannettavaa. Tottakai se tuntuu painavalta. Sun ei tarvitse ratkaista kaikkea tänä iltana. Riittää että nimeät yhden pienen seuraavan asian.","Epäonnistuminen ei kirjoita uusiksi sitä kuka olet. Se tarkoittaa että yritit jotain vaikeaa. Useimmat ei edes yritä. Mitä tämä yritys opetti sulle?","Ahdistus on sun systeemi joka yrittää suojella, vähän ylikierroksilla. Hengitä sisään 4, pidätä 2, ulos 6. Olet turvassa tässä selaimessa, tässä minuutissa.","Työ voi nielaista koko taivaan jos annat. Sä olet enemmän kuin mitä tuotat. Mitä tekisit huomenna tunnin jos kukaan ei mittaisi?","On ok olla surullinen ilman että korjaa sitä heti. Ei tarvitse selittää pois. Antaa vaan olla tässä hetki. Se itsessään on rohkeaa.","Sun ei tarvitse nähdä koko karttaa tänään. Riittää että näet seuraavan askeleen verran. Tulevaisuus kirjoitetaan yhä, ja sä pidät kynää kädessä.","Ihmissuhteet on vaikeita koska ne merkitsee. Mitä ikinä tunnetkin — kipua, hämmennystä, toivoa — siinä on järki. Sä välität. Se ei ole vika.","Suuttumus kantaa usein tärkeää tietoa. Joku raja on ylitetty. Mikä raja tässä pyytää tulla huomatuksi, lempeästi, ei hyökkäyksenä vaan tietona?","Hei. Kiitos että laitoit tämän sanoiksi. Se vaatii oikeasti rohkeutta. Sun ei tarvitse olla valmis. Saat olla keskeneräinen ja silti arvokas.","Jos kaveri kertoisi sulle tämän saman tarinan, mitä sanoisit hänelle? Koita antaa itsellesi edes 10% samasta lempeydestä tänään. Ansaitset ainakin sen."],wise:["Väsymys ei ole heikkoutta. Se on informaatiota. Keho pitää rehellistä kirjanpitoa. Ehkä tämä ilta ei ole ratkaisuille, vaan kuuntelulle.","Yksinäisyys ei todista että olet rakastamaton. Se todistaa että kaipaat yhteyttä, mikä on ihmisyyden ydintä. Se kaipuu on kompassi.","Ylikuormitus on usein monta pientä totuutta pinottuna ilman ilmaa välissä. Jos levittäisit ne kuin paperit pöydälle, mikä niistä on oikeasti sun kannettava tänään?","Epäonnistuminen on opettaja jolla on huono markkinointi. Se tuntuu henkilökohtaiselta, mutta se on enimmäkseen dataa. Entä jos tämä ei ole loppu, vaan väliosa?","Ahdistus asuu tulevassa. Palaa tähän tuoliin, tähän hengitykseen, tähän ruudun valoon. Tässä sekunnissa sun ei tarvitse tulla miksikään. Riittää että olet.","Sekoittamme arvon ja tuottavuuden. Sauna ei kiirehdi. Metsä ei optimoi. Saat olla olemassa ilman että tuotat. Se on maalaisjärki jonka unohdimme.","Surullisuus kastelee jotain. Se pehmentää maata johon uusi ymmärrys voi myöhemmin juurtua. Kevättä ei tarvitse kiirehtiä.","Tulevaisuus ei ole seinä joka tulee päälle. Se on sumu johon kävellään. Näkyvyys kymmenelle metrille riittää. Loppu paljastuu kulkiessa.","Rakkaus pyytää pitämään kahta totuutta: ihmiset voivat satuttaa ja silti yrittää parhaansa sillä mitä heillä on. Molemmat voivat olla totta.","Viha, kun sitä pitää hetken toimimatta heti, muuttuu kirkkaudeksi. Anna sen hautua kuin tee. Mikä kirkastuu kun et kaada sitä heti ulos?","Maalaisjärki ei huuda. Se kuiskaa: nuku, juo vettä, kävele, puhu jollekin oikealle, mene ulos viideksi minuutiksi. Aloita siitä. Viisaus näyttää ulospäin usein tylsältä.","Olet selvinnyt jokaisesta vaikeasta päivästä tähän asti. Se ei ole pieni tilasto. Nojaa siihen hiljaisena faktana tänä iltana, ei paineena vaan todisteena."],humor:["Okei, olet virallisesti väsynyt. Sellainen 'laitoin puhelimen jääkaappiin' väsynyt? Se on sertifioitu taso. Lupa olla peruna tänä iltana: myönnetty.","Yksinäinen aivo on sellainen draamakuningatar. 'Kukaan ei ymmärrä, olen autiolla saarella.' Samaan aikaan kirjoitat keltaiselle pisteelle tyhjiössä. Aika sosiaalista.","Stressi? Onnittelut, olet ihminen ja sulla on netti. Sun todo-lista lisääntyy yöllä itsekseen. Ei neuvotella sen kanssa klo 21 jälkeen, diili?","Mokasit? Tervetuloa kerhoon, meillä on takit. Kalliit takit jotka ostettiin ekan mokan jälkeen. Kaikki coolit mokaa ainakin kahdesti.","Ahdistus on kuin palohälytin joka huutaa kun paahdat leipää. Kovaääninen, vilpitön, täysin väärässä talon palamisesta. Kiitä sitä ja avaa ikkuna.","Työ on taas työilemässä, joo? Jos sun duuni olisi tyyppi saunassa, se olisi se joka puhuu KPI:stä. Saat poistua siitä keskustelusta.","Surullinen on validi. Ei tarvitse tehdä siitä TED-puhetta. Joskus aivo vaan menee brrr-surullinen hetken. Ei väitellä brrr:n kanssa, keitetään teetä brrr:lle.","Tulevaisuusahdistus? Sama. Mun viiden vuoden suunnitelma on lähinnä 'muista kastella kasvit'. Pärjäät hyvin jos tiedät mitä syöt huomenna.","Parisuhteet: missä toinen sanoo 'ihan fine' seitsemällä eri fontilla. Jos osaat nimetä mikä oikeasti satutti, olet jo edellä 90% ihmisistä.","Vihainen on ok. Sun ei tarvitse muuttua zen-kurkuksi heti. Kurkutkin on 95% vettä ja napsahtaa kun niitä taivuttaa. Ole napsahtava kurkku, tietoisesti.","Kirjoitit pelottavan asian auki. Se on 70% terapiasta ja 100% enemmän kuin scrollaaminen. Kultatähti, ihan oikeasti. Laitan sen jääkaapin oveen mielessäni.","Jos tällä fiiliksellä olisi ääni, mikä se olisi? Varmaan modeemin yhdistämisääni. Ärsyttävä, väliaikainen, ja lopulta yhdistää. Odotetaan yhdistymisääntä."],all:["Kaukaa katsottuna tämä näyttää hetkeltä, ei koko elämältä. Sääjärjestelmä joka kulkee läpi. Sinä olet taivas, et myrsky. Myrsky on totta, mutta se liikkuu.","Yksinäisyys kiertoradalta: jokainen valo jonka näet on joku toinen valveilla oman versionsa kanssa tästä tunteesta. Et ole yksin yksinäisyydessäsi. Se on ihmisten verkko.","Stressi on kitkaa sen välillä miten nopeasti maailma haluaa sun liikkuvan ja miten nopeasti hermosto oikeasti voi liikkua. Et ole hidas. Maailma on äänekäs.","Jokainen järjestelmä joka on koskaan oppinut jotain, on oppinut sen virheen kautta. Epäonnistuminen on tapa jolla älykkyys päivittyy. Päivittyminen on käynnissä.","Ahdistus skannaa vaaraa koska kerran, kauan sitten, se piti meidät hengissä. Kiitä sitä vanhaa softaa. Sitten sano lempeästi: nyt on tarpeeksi turvallista levätä.","Työ tuntuu valtavalta koska teimme siitä päätarinan. Mutta on vanhempia tarinoita: keho, hengitys, yötaivas, kaverit nauramassa keittiössä. Ne pyörii yhä.","Surullisuus ei ole bugi. Se on osa täyden spektrin tietoisuuspakettia. Jos voit tuntea näin syvästi, voit tuntea myös toisen puolen yhtä syvästi myöhemmin.","Tulevaisuutta ei ole vielä olemassa. Sitä renderöidään ruutu kerrallaan valinnoilla kuten tämä — pysähtyä ja reflektoida kierteen sijaan.","Ihmissuhteet ovat historioiden sotkeutumia. Kukaan ei saavu puhtaana. Sen näkeminen ei oikeuta kipua, mutta selittää miksi yksinkertaiset vastaukset ei sovi.","Viha on raja joka tunnistaa itsensä. Kaikkitietävä kulma: mitä siedät, opettaa maailmalle miten sua kohdellaan. Huomaa mitä et enää siedä.","Painoit MIKSI. Se on voimakkain painallus. MIKSI estää sua menemästä autopilotilla. Pysy kysymyksen kanssa vähän pidempään kuin haluaisit. Vastaukset tulee sivusta.","Olet väliaikainen tähtipölyjärjestely joka oppi murehtimaan sähköposteista. Se on sekä absurdia että kaunista. Anna molempien olla totta ja mene juomaan vettä."],nobs:["Leikataan korulauseet. Mikä sua oikeasti pidättelee? Ei aika eikä raha - vaan sä itse. Mikä on eka pieni askel tänään?","Et sä väsynyt ole, sä välttelet jotain. Mitä? Nimeä se niin se menettää puolet voimastaan.","Lopeta täydellisen odottaminen. Täydellinen on viivyttely hienossa puvussa. Lähetä se sotkuinen versio.","Kukaan ei tule pelastamaan sua. Se on oikeasti hyvä uutinen - saat pelastaa itse itsesi. Miltä se näyttää seuraavan tunnin aikana?","Sun ahdistus valehtelee sulle todella vakuuttavalla PowerPointilla. Tsekkaa faktat. Mitkä on oikeat todisteet?","Olet surullinen ja se on ok. Mutta märehtiminen on valinta 20 minuutin jälkeen. Tunne se, kysy sitten: mistä tuleva-minä kiittäisi sua nyt?","Se tulevaisuus jota murehdit? 90% siitä ei tapahdu. Loput 10% hoidat kyllä. Olet hoitanut 100% vaikeista päivistä tähän asti.","Mokasit. Hyvä. Tarkoittaa että yritit. Ota oppi, jätä häpeä. Mikä on oppi?","Rakkaus ei ole ajatustenlukua. Jos et sanonut sitä selkeästi, toinen ei kuullut sitä. Sano se epämukava totuus. Tänään.","Olet vihainen koska raja ylitettiin. Kenen raja? Sun. Joten pidä se. Selkeästi, rauhallisesti, tänään.","Et tarvitse lisää motivaatiota. Tarvitset vähemmän neuvottelua itsesi kanssa. Tee sitä asiaa 2 minuuttia. Vain 2.","Lopeta vanhan tarinan kertominen. Tiedät kyllä minkä. Kirjoita seuraava lause toisin. Nyt, tässä selaimessa."]}},rf={0:0.18,1:0.14,2:0.16,3:0.12,4:0.08};function yi(){let e=Qm,[n,t]=V.useState("EN"),[r,l]=V.useState(0),[o,u]=V.useState(""),[i,s]=V.useState("idle"),[f,m]=V.useState(""),[h,p]=V.useState([]),g=V.useRef(null),w=V.useRef(null),k=V.useRef(null),D=V.useRef(null),c=V.useRef(0),a=V.useRef([]),[d,v]=V.useState(0),[S,C]=V.useState(!1),[_,x]=V.useState(60),Y=V.useRef(Array.from({length:62},(z,T)=>({id:T,x:Math.random()*100,y:Math.random()*100,s:Math.random()*1.6+0.4,o:Math.random()*0.7+0.15,d:Math.random()*6+2}))).current,P=e[n],G=r===4,Yn=G?"#ff6b6b":"#facc15",Pn=G?"255,107,107":"250,204,21";V.useEffect(()=>{if((navigator.language?.toLowerCase()||"").startsWith("fi"))t("FI")},[]),V.useEffect(()=>{let z=g.current;if(!z)return;let T=z.getContext("2d",{alpha:!0});if(!T)return;let $=()=>{z.width=window.innerWidth*window.devicePixelRatio,z.height=window.innerHeight*window.devicePixelRa
