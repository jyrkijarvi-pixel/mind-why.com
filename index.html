<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIND - WHY</title>
    <style>
        :root {
            --brand-yellow: #f1c40f;
            --brand-dark: #121212;
            --brand-gray: #1a1a1a;
            --brand-border: #333;
            --text-light: #e0e0e0;
        }
        body { background-color: var(--brand-dark); color: var(--text-light); font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.3s, color 0.3s; }
        
        /* Classic mode -tyylit */
        body.classic-mode { background-color: #f4f4f4; color: #333; }
        body.classic-mode .container { background-color: #fff; border: 2px solid #000; box-shadow: none; }
        body.classic-mode .demo-card { background: #eee; border: 1px solid #ccc; }
        body.classic-mode .logic-selector-zone { background: #ddd; border: 1px solid #bbb; }
        body.classic-mode h1 { color: #000; }
        body.classic-mode .demo-card p a { color: #555 !important; }

        .container { max-width: 800px; width: 100%; border: 1px solid var(--brand-border); padding: 30px; background-color: var(--brand-gray); box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; transition: 0.3s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 13px; color: #888; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .mode-selector button { background: none; border: 1px solid #444; color: #aaa; padding: 5px 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; margin-left: 5px; }
        .mode-selector button.active { background: var(--brand-yellow); color: var(--brand-dark); border-color: var(--brand-yellow); }
        .lang-link { color: var(--brand-yellow); text-decoration: none; margin-right: 10px; font-weight: bold; cursor: pointer; }
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .brand-logo { width: 35px; height: 35px; border: 3px solid var(--brand-yellow); border-radius: 50%; position: relative; flex-shrink: 0; }
        .brand-logo::before, .brand-logo::after { content: ''; position: absolute; background-color: var(--brand-yellow); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .brand-logo::before { width: 4px; height: 20px; } .brand-logo::after { width: 20px; height: 4px; }
        h1 { color: #fff; font-size: 32px; letter-spacing: 2px; margin: 0; }
        .tagline { color: var(--brand-yellow); font-size: 14px; text-transform: uppercase; font-weight: bold; margin: 10px 0 25px 0; border-bottom: 2px solid var(--brand-yellow); padding-bottom: 10px; }
        .logic-selector-zone { background: #222; border: 1px solid var(--brand-border); padding: 15px; margin-bottom: 25px; border-radius: 4px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .logic-select { background: var(--brand-dark); color: #fff; border: 1px solid #444; padding: 8px 12px; font-size: 16px; border-radius: 4px; }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-top: 25px; }
        .demo-card { background: #222; border: 1px solid #333; padding: 20px; border-radius: 6px; }
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; font-size: 16px; margin: 20px 0; box-sizing: border-box; }
        .footer { margin-top: 40px; font-size: 11px; color: #555; text-align: right; }
        /* Linkkien perusmuotoilu */
        .demo-card p a { text-decoration: none; color: #aaa; display: block; margin-bottom: 5px; }
        .demo-card p a:hover { color: var(--brand-yellow); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div><a href="#" class="lang-link" onclick="vaihdaKieli('FI')">[ FI ]</a><a href="#" class="lang-link" onclick="vaihdaKieli('EN')">[ EN ]</a></div>
        <div class="mode-selector">
            <button id="btn-dynamic" class="active" onclick="asetaMoodi('dynamic')">Dynamic</button>
            <button id="btn-classic" onclick="asetaMoodi('classic')">Classic</button>
        </div>
    </div>

    <div class="brand-header"><div class="brand-logo"></div><h1>MIND</h1></div>
    <div id="txt-tagline" class="tagline">Uuden ajan käyttöliittymä terveeseen järkeen.</div>

    <div class="logic-selector-zone">
        <label id="lbl-logic" for="logiikkavalinta">Valitse MIND-suodatuksen taso:</label>
        <select id="logiikkavalinta" class="logic-select" onchange="suodataLogiikanMukaan()">
            <option value="all">Näytä kaikki</option>
            <option value="classic">Arjen logiikka</option>
            <option value="dynamic">Tekninen bittilogiikka</option>
        </select>
    </div>

    <input type="text" id="mindSearch" class="search-box" placeholder="Suodata...">

    <div class="demo-grid" id="main-menu">
        <div class="demo-card">
            <h3 id="m1-title">MIND Luovuus & AI</h3>
            <p><a href="https://gemini.google.com" target="_blank">✨ Gemini (AI & Kuvat)</a></p>
        </div>
        <div class="demo-card">
            <h3 id="m2-title">Some & Viihde</h3>
            <p>
                <a href="https://www.youtube.com" target="_blank">📺 YouTube</a>
                <a href="https://www.tiktok.com" target="_blank">🎵 TikTok</a>
                <a href="https://www.instagram.com" target="_blank">📸 Instagram</a>
            </p>
        </div>
        <div class="demo-card">
            <h3 id="m3-title">Arki & Yhteys</h3>
            <p>
                <a href="https://www.k-ruoka.fi" target="_blank">🛒 K-Ruoka</a>
                <a href="https://www.speedtest.net" target="_blank">⚡ Nopeustesti</a>
                <a href="tel:+358408499100" id="m3-call">📞 Soita Jyrkille: 040 849 9100</a>
            </p>
        </div>
    </div>

    <div class="footer">© 2026 mind-why.com | Powered by 30 years of ICT Logic</div>
</div>

<script>
    const sanasto = {
        'FI': {
            'tagline': 'Uuden ajan käyttöliittymä terveeseen järkeen.',
            'lbl-logic': 'Valitse MIND-suodatuksen taso:',
            'm1': 'MIND Luovuus & AI', 'm1i': '✨ Gemini (AI & Kuvat)',
            'm2': 'Some & Viihde', 'm3': 'Arki & Yhteys', 'call': 'Soita Jyrkille: 040 849 9100'
        },
        'EN': {
            'tagline': 'A modern interface for common sense.',
            'lbl-logic': 'Select MIND filtering level:',
            'm1': 'MIND Creativity & AI', 'm1i': '✨ Gemini (AI & Images)',
            'm2': 'Social Media & Entertainment', 'm3': 'Everyday Life & Connection', 'call': 'Call Jyrki: +358 40 849 9100'
        }
    };

    function vaihdaKieli(kieli) {
        const t = sanasto[kieli];
        document.getElementById('txt-tagline').innerText = t.tagline;
        document.getElementById('lbl-logic').innerText = t['lbl-logic'];
        document.getElementById('m1-title').innerText = t.m1;
        document.getElementById('m3-title').innerText = t.m3;
        document.getElementById('m3-call').innerText = t.call;
    }

    function asetaMoodi(m) {
        document.getElementById('btn-dynamic').classList.toggle('active', m === 'dynamic');
        document.getElementById('btn-classic').classList.toggle('active', m === 'classic');
        document.body.classList.toggle('classic-mode', m === 'classic');
    }

    function suodataLogiikanMukaan() {
        console.log("Suodatus aktivoitu:", document.getElementById('logiikkavalinta').value);
    }
</script>
</body>
</html>
