<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIND‑WHY AI‑KIOSKI</title>

<style>
    :root {
        --bg: #0f1b2b;
        --panel: #14273d;
        --accent: #4dd0e1;
        --accent2: #ffe9b0;
        --text: #e8f1f8;
        --card: #1c324d;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 20px;
        background-image: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 2px,
            transparent 2px,
            transparent 4px
        );
    }

    .wrapper {
        max-width: 900px;
        width: 100%;
    }

    .sidebar {
        background: #0b1623;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 1px solid #1c324d;
    }

    .sidebar h3 {
        margin: 0 0 10px 0;
        color: var(--accent);
    }

    .sidebar a {
        display: inline-block;
        margin-right: 15px;
        margin-bottom: 8px;
        color: var(--accent2);
        text-decoration: none;
        font-size: 14px;
    }

    .top-light {
        height: 12px;
        background: linear-gradient(90deg, #0ff, #4dd0e1, #0ff);
        border-radius: 8px;
        box-shadow: 0 0 20px #4dd0e1;
        margin-bottom: 10px;
    }

    .kiosk {
        background: var(--panel);
        padding: 25px;
        border-radius: 10px;
        border: 1px solid #1c324d;
    }

    .kiosk-door {
        background: #0b1623;
        border: 2px solid #1c324d;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
        transition: transform 0.4s ease;
    }

    .door-open {
        transform: rotateX(45deg);
    }

    .logo-text {
        font-size: 36px;
        text-align: center;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent);
        margin-bottom: 5px;
    }

    .logo-sub {
        text-align: center;
        color: var(--accent2);
        margin-bottom: 20px;
    }

    .search-box {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 2px solid var(--accent);
        background: var(--card);
        color: var(--text);
        margin-bottom: 10px;
    }

    .action-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 20px;
    }

    .kiosk-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 15px;
    }

    .kiosk-card {
        background: var(--card);
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #2a4a6a;
    }

    .kiosk-card h3 {
        margin: 0 0 10px 0;
        color: var(--accent2);
    }

    .kiosk-card a {
        color: var(--accent);
        text-decoration: none;
        display: block;
        margin-top: 5px;
    }

    .puppu-btn {
        width: 100%;
        padding: 14px;
        background: var(--accent2);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
    }

    .puppu-output {
        margin-top: 10px;
        background: #0b1623;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #2a4a6a;
        min-height: 40px;
    }

</style>
</head>
<body>

<div class="wrapper">

    <div class="sidebar">
        <h3>VALIKKO</h3>
        <a href="#">AI‑Kioski</a>
        <a href="#">Pupu‑generaattori</a>
        <a href="#">Promptit</a>
        <a href="#">Tietoa</a>
    </div>

    <div class="top-light"></div>

    <div class="kiosk">

        <div class="kiosk-door" id="door">AI‑KIOSKI</div>

        <div class="logo-text">MIND‑WHY</div>
        <div class="logo-sub">AI‑KIOSKI</div>

        <input id="query" class="search-box" placeholder="Kysy jotain...">
        <button class="action-btn" onclick="goGemini()">HAE GEMINISTÄ</button>

        <div class="kiosk-grid">

            <div class="kiosk-card">
                <h3>✉ Kirjoita puolestani</h3>
                <a href="#" onclick="openGemini('Kirjoita minulle selkeä sähköposti.')">Sähköposti</a>
                <a href="#" onclick="openGemini('Laadi minulle ystävällinen viesti.')">Viesti</a>
            </div>

            <div class="kiosk-card">
                <h3>🧠 Selitä minulle</h3>
                <a href="#" onclick="openGemini('Selitä asia kuin olisin 10-vuotias.')">Selkokieli</a>
                <a href="#" onclick="openGemini('Selitä tämä lyhyesti.')">Lyhyt selitys</a>
            </div>

            <div class="kiosk-card">
                <h3>🎨 Tee minulle kuva</h3>
                <a href="#" onclick="openGemini('Luo kuva tästä aiheesta.')">Kuva</a>
                <a href="#" onclick="openGemini('Luo hauska kuva.')">Hauska kuva</a>
            </div>

            <div class="kiosk-card">
                <h3>📚 Arjen apu</h3>
                <a href="#" onclick="openGemini('Laadi ostoslista.')">Ostoslista</a>
                <a href="#" onclick="openGemini('Laadi päivän suunnitelma.')">Päivän suunnitelma</a>
            </div>

        </div>

        <button class="puppu-btn" onclick="generatePuppu()">🎲 AI PUPPU‑GENERAATTORI™</button>
        <div class="puppu-output" id="puppuOutput">Paina nappia saadaksesi satunnaista AI‑pupua.</div>

    </div>
</div>

<audio id="plingSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<script>
function goGemini() {
    const q = document.getElementById('query').value;
    if (!q) return;
    window.open("https://gemini.google.com/app?q=" + encodeURIComponent(q), "_blank");
}

function openGemini(text) {
    window.open("https://gemini.google.com/app?q=" + encodeURIComponent(text), "_blank");
}

function generatePuppu() {
    const items = [
        "Keksi minulle täysin absurdi vitsi.",
        "Luo kuva hassusta robotista, joka syö jäätelöä.",
        "Selitä kvanttifysiikka kuin olisin koira.",
        "Keksi uusi eläinlaji ja kuvaile se.",
        "Kirjoita lyhyt tarina, jossa AI menee kauppaan.",
        "Tee minulle satunnainen runo.",
        "Keksi uusi suomalainen perinne.",
        "Luo kuva lentävästä kahvinkeittimestä.",
        "Keksi minulle uusi supervoima.",
        "Selitä jokin asia täysin väärin mutta hauskasti."
    ];

    const random = items[Math.floor(Math.random() * items.length)];
    document.getElementById('puppuOutput').innerText = random;

    document.getElementById('plingSound').play();

    const door = document.getElementById('door');
    door.classList.add('door-open');
    setTimeout(() => door.classList.remove('door-open'), 600);

    openGemini(random);
}
</script>

</body>
</html>
