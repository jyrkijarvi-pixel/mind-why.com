<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELDERMIND | Cyber-Kioski</title>
    <style>
        :root { --yellow: #f1c40f; --dark: #0a0a0a; --panel: #1a1a1a; --border: #333; --text: #dcdcdc; }
        body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; }
        
        /* Glassmorphism Panel */
        .kiosk { background: rgba(26, 26, 26, 0.8); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .logo { width: 40px; height: 40px; border: 3px solid var(--yellow); border-radius: 50%; position: relative; }
        .logo::before, .logo::after { content: ''; position: absolute; background: var(--yellow); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .logo::before { width: 4px; height: 22px; } .logo::after { width: 22px; height: 4px; }
        
        h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        
        .search-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { background: #000; border: 1px solid var(--border); padding: 15px; color: #fff; border-radius: 6px; font-size: 16px; }
        .action-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: #222; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .chip:hover { border-color: var(--yellow); color: var(--yellow); }
        
        .action-btn { background: var(--yellow); color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: #151515; padding: 15px; border-radius: 8px; border: 1px solid #222; }
        .card h3 { color: var(--yellow); font-size: 14px; margin-bottom: 10px; }
        .card a { display: block; color: #aaa; text-decoration: none; padding: 4px 0; font-size: 14px; }
        .card a:hover { color: #fff; }
        
        #notesArea { width: 100%; height: 80px; background: #111; border: 1px solid #333; color: #888; padding: 10px; margin-top: 20px; border-radius: 6px; font-size: 13px; resize: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="kiosk">
        <div class="brand-header">
            <div class="logo"></div>
            <h1>ELDERMIND</h1>
        </div>

        <div class="search-area">
            <div class="action-chips">
                <span class="chip" onclick="fill('Selitä teknisesti: ')">Selitä</span>
                <span class="chip" onclick="fill('Koodaa tämä: ')">Koodaa</span>
                <span class="chip" onclick="fill('Analysoi tämä: ')">Analysoi</span>
                <span class="chip" onclick="fill('Luo kuva: ')">Kuvita</span>
            </div>
            <input type="text" id="query" placeholder="Kysy Gemini-tekoälyltä...">
            <button class="action-btn" onclick="go()">HAE GEMINISTÄ</button>
        </div>

        <div class="grid">
            <div class="card">
                <h3>LIIKENNE & AI</h3>
                <a href="https://gemini.google.com" target="_blank">✨ Gemini AI</a>
                <a href="https://latauskartta.fi" target="_blank">🔋 Latauskartta.fi</a>
            </div>
            <div class="card">
                <h3>TYÖKALUT</h3>
                <a href="https://speedtest.net" target="_blank">⚡ Nopeustesti</a>
                <a href="https://ifconfig.me" target="_blank">🌐 IP-osoite</a>
            </div>
        </div>

        <textarea id="notesArea" placeholder="Nopeat muistiinpanot (tallennettu selaimeen)..."></textarea>
    </div>
</div>

<script>
    // Prompt-toiminto
    function fill(text) { const q = document.getElementById('query'); q.value = text; q.focus(); }
    
    // Haku
    function go() {
        const q = document.getElementById('query').value;
        if (q) window.open('https://gemini.google.com/app?q=' + encodeURIComponent(q), '_blank');
    }

    // Selaimen muistio
    const notes = document.getElementById('notesArea');
    notes.value = localStorage.getItem('myNotes') || '';
    notes.addEventListener('input', () => localStorage.setItem('myNotes', notes.value));
</script>

</body>
</html>
