<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELDERMIND | Dashboard</title>
    <style>
        :root { --brand-yellow: #f1c40f; --brand-dark: #121212; --brand-gray: #1a1a1a; --text-light: #e0e0e0; }
        body { background-color: var(--brand-dark); color: var(--text-light); font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; border: 1px solid #333; padding: 30px; background-color: var(--brand-gray); border-radius: 8px; }
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        h1 { color: #fff; font-size: 28px; margin: 0; }
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 12px; background: var(--brand-yellow); border: none; font-weight: bold; cursor: pointer; color: #000; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card h3 { font-size: 14px; color: #777; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .card a { color: var(--brand-yellow); text-decoration: none; display: block; margin: 5px 0; }
        .footer { margin-top: 40px; font-size: 11px; color: #555; text-align: right; border-top: 1px solid #333; padding-top: 10px; }
        .support-link { color: #777; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header"><h1>ELDERMIND</h1></div>
    
    <input type="text" id="mindSearch" class="search-box" placeholder="Kysy jotain...">
    <button onclick="ohjaaGeminiin()">HAE GEMINISTÄ</button>

    <div class="grid">
        <div class="card">
            <h3>Luovuus & AI</h3>
            <a href="https://gemini.google.com" target="_blank">✨ Gemini (AI & Kuvat)</a>
        </div>
        <div class="card">
            <h3>Dev Tools</h3>
            <a href="https://ifconfig.me" target="_blank">🔍 Check My IP</a>
            <a href="https://www.speedtest.net" target="_blank">⚡ Nopeustesti</a>
        </div>
        <div class="card">
            <h3>Some & Viihde</h3>
            <a href="https://www.youtube.com" target="_blank">📺 YouTube</a>
            <a href="https://www.tiktok.com" target="_blank">🎵 TikTok</a>
            <a href="https://www.facebook.com" target="_blank">📘 Facebook</a>
        </div>
        <div class="card">
            <h3>Arki & Yhteys</h3>
            <a href="https://www.k-ruoka.fi" target="_blank">🛒 K-Ruoka</a>
            <a href="tel:+358408499100">📞 040 849 9100</a>
        </div>
    </div>
    
    <div class="footer">
        © 2026 mind-why.com | Powered by ICT Logic
        <br>
        <a href="https://paypal.me/JyrkiAntero" target="_blank" class="support-link">Support infrastructure costs via PayPal</a>
    </div>
</div>

<script>
function ohjaaGeminiin() {
    const query = document.getElementById('mindSearch').value;
    if (!query) return;
    navigator.clipboard.writeText(query).then(() => {
        window.open('https://gemini.google.com/', '_blank');
    });
}
</script>
</body>
</html>
