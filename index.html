<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>ELDERMIND | Dashboard</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: Arial; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; }
        button { padding: 10px 20px; margin-top: 10px; cursor: pointer; background: #f1c40f; border: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>ELDERMIND</h1>
    <input type="text" id="mindSearch" class="search-box" placeholder="Kysy jotain...">
    <button onclick="ohjaaGeminiin()">HAE GEMINISTÄ</button>
</div>

<script>
function ohjaaGeminiin() {
    const query = document.getElementById('mindSearch').value;
    if (!query) return;
    
    // Kopioidaan leikepöydälle, jotta voit vain liittää (Ctrl+V) chattiin
    navigator.clipboard.writeText(query).then(() => {
        window.open('https://gemini.google.com/', '_blank');
    });
}
</script>
</body>
</html>
